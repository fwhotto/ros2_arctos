# Velocity bounds come from the canonical URDF. Conservative planning-only
# acceleration estimates (rad/s^2); these are not measured motor capabilities.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1
joint_limits:
  Left_jaw_joint: {has_acceleration_limits: true, max_acceleration: 0.05}
  Right_jaw_joint: {has_acceleration_limits: true, max_acceleration: 0.05}
  X_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
  Y_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
  Z_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
  A_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
  B_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
  C_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
